{% if page.paginator.num_pages > 1 %}
<div class="pagination">
  {% if page.has_previous %}
    <a href="?{% for k, v in request.GET.items %}{% if k != 'page' %}{{ k }}={{ v|urlencode }}&{% endif %}{% endfor %}page={{ page.previous_page_number }}">←</a>
  {% endif %}
  <span class="current">{{ page.number }}</span>
  <span class="muted">из {{ page.paginator.num_pages }} · всего {{ page.paginator.count }}</span>
  {% if page.has_next %}
    <a href="?{% for k, v in request.GET.items %}{% if k != 'page' %}{{ k }}={{ v|urlencode }}&{% endif %}{% endfor %}page={{ page.next_page_number }}">→</a>
  {% endif %}
</div>
{% endif %}
